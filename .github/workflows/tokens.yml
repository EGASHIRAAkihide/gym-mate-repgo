name: Build Tokens

on:
  pull_request:
    paths:
      - "design/**"
      - "scripts/generate-dart-tokens.ts"
  push:
    paths:
      - "design/**"

jobs:
  build-tokens:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # 2. pnpm をセットアップ
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      # 3. Node.js をセットアップ（pnpm 用キャッシュ）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # 4. pnpm が本当に使えるか確認（デバッグ用）
      - name: Check pnpm
        run: pnpm -v

      # 5. 依存関係インストール
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 6. トークン生成
      - name: Build tokens
        run: pnpm run tokens

      # 7. Dart ファイルを Artifact としてアップロード
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokens-gen
          path: apps/mobile/lib/design/tokens.gen.dart