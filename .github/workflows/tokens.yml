name: Build Tokens
on:
  pull_request:
    paths:
      - "design/**"
      - "scripts/generate-dart-tokens.ts"
  push:
    paths:
      - "design/**"

jobs:
  build-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"
          run_install: false # ここは false のままでOK（下で自前で install しているので）

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm run tokens

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokens-gen
          path: apps/mobile/lib/design/tokens.gen.dart